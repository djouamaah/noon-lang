name: Tests and docs

# Every push to main runs the tests, builds the site in strict mode (any
# warning fails the build), and publishes it to GitHub Pages. Pull requests
# build without publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Language tests
        run: python tests/test_noon.py

      - name: Compiler and VM tests (identical to the interpreter everywhere)
        run: python tests/test_vm.py

      - name: Docs tests (every example runs, every output matches)
        run: python tests/test_docs.py

      - name: Playground tests (runner, browser bundle, share links)
        run: python tests/test_playground.py

      - name: Grammar is up to date
        run: python tools/build_grammar.py --check

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  # يبني ما يُرفق بالإصدار في كل دفعة، فتظهر مشكلة التحزيم قبل وسم الإصدار لا بعده
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versions agree everywhere
        run: python tools/check_version.py

      - name: Build the Python package
        run: |
          pip install build
          python -m build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@3 package --out ../../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
