<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ساحة نون</title>
  <meta name="description" content="اكتب شيفرة «نون» وشغّلها في المتصفّح مباشرة، بلا تثبيت.">
  <link rel="icon" href="../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="playground.css">
  <!-- نسخة واحدة من كل حزمة: حزم +esm الجاهزة تثبّت إصدارات مختلفة من
       @codemirror/state فتنكسر المقارنات بين نسخها -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6.7.5/dist/index.js",
      "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6.43.12/dist/index.js",
      "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6.12.4/dist/index.js",
      "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.11.1/dist/index.js",
      "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6.7.2/dist/index.js",
      "@lezer/highlight": "https://cdn.jsdelivr.net/npm/@lezer/highlight@1.2.3/dist/index.js",
      "@lezer/common": "https://cdn.jsdelivr.net/npm/@lezer/common@1.5.2/dist/index.js",
      "@marijn/find-cluster-break": "https://cdn.jsdelivr.net/npm/@marijn/find-cluster-break@1.0.4/src/index.js",
      "crelt": "https://cdn.jsdelivr.net/npm/crelt@1.0.7/index.js",
      "style-mod": "https://cdn.jsdelivr.net/npm/style-mod@4.1.3/src/style-mod.js",
      "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2.2.8/index.js"
    }
  }
  </script>
  <script type="module" src="playground.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="../" title="التوثيق">
      <img src="../assets/logo.svg" alt="" width="28" height="28">
      <span>ساحة نون</span>
    </a>

    <div class="actions">
      <button id="run" class="primary" disabled title="Ctrl + Enter">
        <span aria-hidden="true">▶</span> تشغيل <kbd>Ctrl ⏎</kbd>
      </button>
      <button id="stop" class="danger" hidden title="Esc">
        <span aria-hidden="true">■</span> إيقاف
      </button>

      <select id="examples" aria-label="أمثلة">
        <option value="">أمثلة…</option>
      </select>

      <select id="engine" aria-label="المحرّك">
        <option value="vm">الآلة الافتراضية</option>
        <option value="tree">المُفسِّر الشجري</option>
      </select>

      <label class="check">
        <input type="checkbox" id="digits"> أرقام عربية
      </label>

      <button id="share" title="Ctrl + S">مشاركة</button>
      <a class="link" href="../">التوثيق</a>
    </div>
  </header>

  <main class="panes">
    <section class="pane editor-pane" aria-label="المحرّر">
      <div id="editor"></div>
    </section>

    <section class="pane output-pane">
      <div class="tabs" role="tablist" aria-label="الناتج">
        <button role="tab" data-tab="output" aria-controls="output" aria-selected="true">الناتج</button>
        <button role="tab" data-tab="stdin" aria-controls="stdin-panel" aria-selected="false">الدخل</button>
        <button role="tab" data-tab="bytecode" aria-controls="bytecode" aria-selected="false">البايت-كود</button>
      </div>
      <pre id="output" role="tabpanel" aria-live="polite"></pre>
      <div id="stdin-panel" role="tabpanel" hidden>
        <p class="hint">ما تكتبه هنا تقرؤه <code>اقرأ()</code>، سطرًا لكل نداء بالترتيب.</p>
        <textarea id="stdin" dir="auto" spellcheck="false" placeholder="زيد&#10;٤٢"></textarea>
      </div>
      <pre id="bytecode" role="tabpanel" hidden></pre>
    </section>
  </main>

  <footer class="status">
    <span id="status" data-kind="loading">جارٍ التحميل…</span>
    <span id="timing"></span>
  </footer>

  <div id="toast" role="status" hidden></div>

  <noscript><p class="noscript">ساحة التجربة تحتاج JavaScript.</p></noscript>
</body>
</html>
