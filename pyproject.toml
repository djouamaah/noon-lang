[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noon-lang"
version = "1.1.0"
description = "نون — an Arabic-syntax programming language with a bytecode compiler, a virtual machine and a tree-walking interpreter"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Djouamaa Hocine" }]
keywords = ["arabic", "programming-language", "interpreter", "compiler", "noon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Arabic",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://djouamaah.github.io/noon-lang/"
Playground = "https://djouamaah.github.io/noon-lang/playground/"
Source = "https://github.com/djouamaah/noon-lang"

[project.scripts]
noon = "noon.cli:main"

[tool.setuptools]
packages = ["noon"]
